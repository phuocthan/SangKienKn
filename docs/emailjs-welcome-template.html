<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chào mừng đến với GreenEdu</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px 12px;
      background: #f7f6ef;
      font-family: Arial, sans-serif;
      color: #243f32;
    "
  >
    <table
      role="presentation"
      style="
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        border-collapse: collapse;
        background: #ffffff;
        border: 1px solid #dce7da;
      "
    >
      <tr>
        <td
          style="
            padding: 28px 28px 12px;
            font-size: 24px;
            font-weight: 700;
            color: #226344;
          "
        >
          GreenEdu
        </td>
      </tr>
      <tr>
        <td
          style="
            padding: 8px 28px 24px;
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-line;
          "
        >
          {{message}}
        </td>
      </tr>
      <tr>
        <td style="padding: 0 28px 28px">
          <a
            href="{{app_url}}"
            style="
              display: inline-block;
              padding: 12px 20px;
              background: #226344;
              color: #ffffff;
              border-radius: 8px;
              text-decoration: none;
              font-size: 15px;
              font-weight: 700;
            "
            >Mở GreenEdu</a
          >
        </td>
      </tr>
      <tr>
        <td
          style="
            padding: 16px 28px;
            border-top: 1px solid #e6ece3;
            font-size: 12px;
            line-height: 1.5;
            color: #66786a;
          "
        >
          Đây là email thông báo tạo tài khoản GreenEdu. Nếu bạn không nhận ra
          tài khoản này, vui lòng liên hệ Admin hoặc giáo viên của trường.
        </td>
      </tr>
    </table>
  </body>
</html>
